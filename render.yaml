services:
  - type: web
    name: task-manager-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value
      - key: CLIENT_URL
        value: https://your-app.vercel.app  # ← replace with your real Vercel URL after deploy
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production

databases:
  - name: task-manager-db
    plan: free
    databaseName: taskmanager
